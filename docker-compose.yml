version: "3.9"

services:

  # ─── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: wafr-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    networks:
      - wafr-net
    # NOT exposed to public — only internal

  # ─── Keycloak ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: wafr-keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASS}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8080:8080"
    networks:
      - wafr-net

  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wafr-backend
    restart: always
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017
      DB_NAME: wafr_db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KC_REALM}
      KEYCLOAK_ADMIN_USER: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASS}
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - keycloak
    networks:
      - wafr-net

volumes:
  mongo_data:

networks:
  wafr-net:
    driver: bridge
